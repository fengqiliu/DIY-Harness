name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    name: 配置校验与回归测试
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 配置校验（verify.py）
        run: python -X utf8 scripts/verify.py

      - name: 回归测试（evals）
        run: python -X utf8 -B -m unittest discover -s evals -v
